version: 2

models:
  - name: stg_earthquake_versions
    description: >
      One row per event version, flattened from the raw files. Each feature is kept once per
      (event_id, updated_ms), from the first file it was loaded in. Invalid features are skipped.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [event_id, updated_ms]
    columns:
      - name: event_id
        data_tests: [not_null]
      - name: updated_ms
        description: When USGS last revised the event (epoch ms); identifies the version.
        data_tests: [not_null]
      - name: feature
        description: The GeoJSON feature as loaded (a VARIANT).

  - name: stg_earthquakes
    description: Latest version of every event, as typed columns. Includes non-earthquakes and deleted events.
    columns:
      - name: event_id
        description: USGS event ID.
        data_tests: [unique, not_null]
      - name: mag
        description: Magnitude. Null for a few events; can be negative for very small quakes.
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: -2, max_value: 10}
      - name: event_type
        description: earthquake, quarry blast, explosion, ice quake, etc.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - earthquake
                  - quarry blast
                  - explosion
                  - mining explosion
                  - ice quake
                  - other event
                  - landslide
              # USGS adds rarer types over time; a new one should be flagged, not break the build.
              config: {severity: warn}
      - name: status
        description: automatic, reviewed or deleted.
        data_tests:
          - accepted_values:
              arguments: {values: [automatic, reviewed, deleted]}
      - name: latitude
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: -90, max_value: 90}
      - name: longitude
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: -180, max_value: 180}
      - name: depth_km
        description: Depth below sea level. Slightly negative means above sea level.
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: -10, max_value: 800}
      - name: occurred_at
        data_tests: [not_null]
      - name: n_versions
        description: How many versions of this event are stored in raw.
