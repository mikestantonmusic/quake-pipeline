name: CI

on:
  push:
    branches: [main, cloud]
  pull_request:

# Cancel an older run for the same branch when a newer commit is pushed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"  # matches the Airflow image and the Streamlit Community Cloud app

jobs:
  lint:
    name: Lint (ruff, sqlfluff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint Python
        run: ruff check .
      - name: Lint dbt SQL
        run: sqlfluff lint dbt/quake/models dbt/quake/tests

  test:
    name: Python tests
    runs-on: ubuntu-latest
    # No cloud access: S3 is faked with moto, and Snowflake with stand-in connections and
    # canned query results.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Run pytest
        run: pytest -rs

  dbt:
    name: dbt parse (Snowflake project)
    runs-on: ubuntu-latest
    # Parsing checks every model, ref(), source(), macro and YAML file compiles into a valid
    # project, without connecting to Snowflake. It doesn't run the SQL: that happens daily
    # in Airflow, where the data tests check the results.
    env:
      SNOWFLAKE_ACCOUNT: ci-placeholder
      SNOWFLAKE_USER: ci-placeholder
      SNOWFLAKE_PRIVATE_KEY_PATH: /dev/null
      DBT_PROFILES_DIR: .
    defaults:
      run:
        working-directory: dbt/quake
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dbt (same versions as the Airflow image)
        run: pip install dbt-core==1.12.6 dbt-snowflake==1.12.5
      - run: dbt deps
      - run: dbt parse
