version: 2

models:
  - name: fct_earthquakes
    description: One row per earthquake. The main table for analysis and the dashboard.
    columns:
      - name: event_id
        data_tests: [unique, not_null]
      - name: occurred_at
        description: When the earthquake happened (UTC).
        data_tests: [not_null]
      - name: mag_class
        description: Standard magnitude band; 'unknown' when magnitude is null.
        data_tests:
          - accepted_values:
              arguments:
                values: [unknown, micro, minor, light, moderate, strong, major, great]
      - name: depth_class
        description: shallow (<70 km), intermediate (70-300 km) or deep (300+ km).
        data_tests:
          - accepted_values:
              arguments:
                values: [unknown, shallow, intermediate, deep]
      - name: region
        description: Text after the last comma in place (or all of place if none), with codes like CA expanded.
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_region'), field: region}
      - name: is_significant
        description: USGS significance score (sig) of at least 600.
      - name: all_ids
        description: Every ID USGS has used for this quake, e.g. ",aka2026tsyezt,us7000ttd7,".
  - name: dim_region
    description: One row per region.
    columns:
      - name: region
        data_tests: [unique, not_null]
  - name: agg_daily_by_region
    description: Daily earthquake stats per region.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [occurred_date, region]
  - name: pipeline_files
    description: >
      One row per raw file per COPY attempt, with its load status and size. Read by the
      dashboard's pipeline health page.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [source_file, loaded_at]
    columns:
      - name: source_file
        description: S3 key, e.g. raw/feed/all_day/2026/11/25/20261125T1300Z.geojson.
        data_tests: [not_null]
      - name: source
        data_tests:
          - accepted_values:
              arguments:
                values: [feed, fdsn]
      - name: status
        description: LOADED, LOAD_FAILED or PARTIALLY_LOADED, as reported by COPY INTO.
        data_tests: [not_null]
      - name: n_features
        description: Events in the file (null if it failed to load).
      - name: file_last_modified
        description: When the file was written to S3, i.e. when the extract ran.
      - name: loaded_at
        description: When the COPY that loaded the file ran.
        data_tests: [not_null]

seeds:
  - name: region_aliases
    description: Maps abbreviations in USGS place names to full region names.
    columns:
      - name: alias
        data_tests: [unique, not_null]
