name: quake
version: "1.0.0"
config-version: 2
profile: quake

model-paths: ["models"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
test-paths: ["tests"]
# Where `dbt deps` puts packages. The Airflow image installs them once at build time into
# DBT_PACKAGES_DIR, because ./dbt is mounted over the image's copy when containers run.
packages-install-path: "{{ env_var('DBT_PACKAGES_DIR', 'dbt_packages') }}"

models:
  quake:
    staging:
      +schema: staging
    marts:
      +schema: marts
      +materialized: table

seeds:
  quake:
    +schema: staging
