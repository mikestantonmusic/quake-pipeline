version: 2

sources:
  - name: usgs
    schema: raw
    description: Raw files copied unchanged from S3 by ingestion/snowflake_load.py.
    tables:
      - name: feed_files
        description: >
          One row per GeoJSON file (an hourly feed download or one backfill day). payload holds
          the whole FeatureCollection; a file rewritten in S3 with new content is loaded again.
        config:
          loaded_at_field: loaded_at
          freshness:
            # Loads run once a day, so allow a day plus slack before warning.
            warn_after: {count: 26, period: hour}
            error_after: {count: 50, period: hour}
      - name: load_audit
        description: One row per file per COPY, with its load status.
